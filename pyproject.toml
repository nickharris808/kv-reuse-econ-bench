[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-reuse-econ-bench"
version = "0.1.0"
description = "Recompute our published headline from its certificate, offline, in about a second"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kv-reuse-econ-bench = "econ_bench:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The committed certificates this benchmark verifies against. Without them the installed
# package can verify NOTHING, so they must ship in the wheel.
econ_bench = ["fixtures/*.json"]

[tool.cold_install]
smoke = ["--verify"]
